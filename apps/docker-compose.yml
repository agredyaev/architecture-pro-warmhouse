x-base-service: &base-service
  restart: unless-stopped
  networks:
    - smarthome-network

services:
  postgres:
    <<: *base-service
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  temperature-api:
    <<: *base-service
    build: ./temperature-api
    ports:
      - "8083:8081"

  app:
    <<: *base-service
    build: ./smart_home
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
      device-service:
        condition: service_started
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TEMPERATURE_API_URL: ${TEMPERATURE_API_URL}
      DEVICE_SERVICE_URL: "device-service:50051"
    ports:
      - "${APP_PORT}:8080"

  rabbitmq:
    <<: *base-service
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  device-service:
    <<: *base-service
    build: ./device-service-python
    ports:
      - "50051:50051"
    environment:
      RABBITMQ_HOST: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy

  telemetry-service:
    <<: *base-service
    build: ./telemetry-service-csharp
    ports:
      - "8082:8080"
    environment:
      RabbitMqHost: "rabbitmq"
    depends_on:
      rabbitmq:
        condition: service_healthy

  tests:
    build:
      context: ./tests
      dockerfile: Dockerfile
    depends_on:
      app:
        condition: service_started
    command: >
      "pytest /app/integration"
    restart: "no"
    networks:
      - smarthome-network
 
volumes:
  postgres_data:

networks:
  smarthome-network:
    driver: bridge