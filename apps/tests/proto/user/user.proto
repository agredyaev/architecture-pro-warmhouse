syntax = "proto3";

package user;

option go_package = "github.com/your-repo/smart-home/pkg/user_service;user_service";

import "google/protobuf/timestamp.proto";

// --- Messages for core entities ---

message User {
    string id = 1;
    string full_name = 2;
    string email = 3;
    google.protobuf.Timestamp created_at = 4;
    google.protobuf.Timestamp updated_at = 5;
}

message House {
    string id = 1;
    string name = 2;
    string address = 3;
    string owner_id = 4;
    google.protobuf.Timestamp created_at = 5;
    google.protobuf.Timestamp updated_at = 6;
}

// --- Service Methods ---

service UserService {
    // --- User Methods ---
    rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
    rpc Login(LoginRequest) returns (LoginResponse);
    rpc GetUser(GetUserRequest) returns (GetUserResponse);

    // --- House Methods ---
    rpc AddHouse(AddHouseRequest) returns (AddHouseResponse);
    rpc GetUserHouses(GetUserHousesRequest) returns (GetUserHousesResponse);
}

// --- Request/Response Messages ---

// RegisterUser
message RegisterUserRequest {
    string full_name = 1;
    string email = 2;
    string password = 3;
}

message RegisterUserResponse {
    string user_id = 1;
}

// Login
message LoginRequest {
    string email = 1;
    string password = 2;
}

message LoginResponse {
    string token = 1; // JWT token
}

// GetUser
message GetUserRequest {
    string user_id = 1;
}

message GetUserResponse {
    User user = 1;
}

// AddHouse
message AddHouseRequest {
    string name = 1;
    string address = 2;
    string owner_id = 3;
}

message AddHouseResponse {
    string house_id = 1;
}

// GetUserHouses
message GetUserHousesRequest {
    string user_id = 1;
}

message GetUserHousesResponse {
    repeated House houses = 1;
}