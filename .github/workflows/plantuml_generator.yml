name: PlantUML Diagram Generator

on:
  push:
    branches:
      - main
      - warmhouse

jobs:
  generate_diagrams:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate PlantUML diagrams
        id: plantuml
        uses: grassedge/generate-plantuml-action@v1.6.0
        with:
          path: .
          message: "[CI] Auto-generate PlantUML diagrams"
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit & Push changes
        if: steps.plantuml.outputs.has_generated == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[CI] Auto-generate PlantUML diagrams"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
